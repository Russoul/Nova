name: nova

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

jobs:

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme libgmp-dev

      # ~/.pack holds pack itself plus the toolchain it resolves from
      # pack.toml (the pinned idris2 commit, the package collection and
      # the custom dependencies), so a hit skips the whole Idris2
      # bootstrap. Keyed on pack.toml: changing any pin rebuilds.
      - name: Cache pack and toolchain
        id: pack-cache
        uses: actions/cache@v4
        with:
          path: ~/.pack
          key: pack-${{ runner.os }}-${{ hashFiles('pack.toml') }}

      - name: Install pack
        if: steps.pack-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/stefan-hoeck/idris2-pack
          cd idris2-pack
          make micropack SCHEME=chezscheme

      - name: Add pack to PATH
        run: echo "$HOME/.pack/bin" >> "$GITHUB_PATH"

      - name: Build Nova
        run: pack build nova.ipkg

      - name: Run tests
        run: ./test.sh

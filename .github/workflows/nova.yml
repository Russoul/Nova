name: nova

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

# A superseded PR run has nothing worth finishing; main runs are left
# alone so every commit's site artifact is actually produced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # The gates, from the flake: `nix flake check` runs the spec
  # cross-check, the golden test suite, the elaboration gate, the
  # distill round-trip and the docs render (nix/checks.nix).
  #
  # No toolchain cache is configured, and none is needed: flake.lock
  # pins every dependency, and everything expensive — the Idris2
  # compiler, chez, the prelude libraries — is fetched prebuilt from
  # cache.nixos.org. A cold run builds only just-a-parser, lsp-lib and
  # the four Nova executables.
  nix:
    strategy:
      fail-fast: false
      matrix:
        # The two platforms anyone actually uses: CI's, and the one
        # Nova is developed on. aarch64-linux and x86_64-darwin stay
        # declared in flake.nix but ungated — there is no FFI and no C
        # here, so platform-specific breakage is unlikely.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Logs are printed only on failure: a passing run would otherwise
      # bury itself in the LSP tests' debug output.
      - name: Run every gate
        run: nix flake check

      # Built here rather than in a job of its own so the Pages
      # artifact reuses this leg's store instead of rebuilding Nova on
      # a third machine.
      - name: Build the docs site
        if: matrix.os == 'ubuntu-24.04'
        run: |
          nix build .#site --out-link result-site
          # Dereference the store symlink and restore write permission;
          # upload-artifact cannot read a /nix/store path directly.
          cp -rL result-site site
          chmod -R u+w site

      - name: Upload the docs site
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  # A smoke test for the toolchain the flake does NOT use: pack.toml
  # pins Idris2 at 0e9b01d, while the flake takes nixpkgs' 0.8.0
  # release. Without this job nothing would exercise the compiler Nova
  # is actually developed against.
  #
  # Compile-only on purpose. The gates above already run the full suite;
  # this exists to catch a nightly that stops accepting the sources, and
  # a second full test run would not pay for itself.
  pack:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme libgmp-dev

      # pack is XDG-based: ~/.local/state/pack holds the toolchain it
      # resolves from pack.toml (the pinned idris2 commit, the package
      # collection, the custom dependencies), ~/.config/pack the global
      # config, ~/.local/bin/pack the launcher (already on the runner's
      # PATH). A hit skips the whole Idris2 bootstrap. Keyed on
      # pack.toml, so changing a pin misses — but restore-keys then
      # falls back to the most recent toolchain we built, and pack
      # fetches just the dependency whose pin moved. That fallback is
      # what keeps a one-line pin change off the cold path: micropack
      # resolves the WHOLE package collection, ~238 third-party repos,
      # and any one of them being unreachable fails the build (observed:
      # codeberg.org 504s taking down a run that only repinned
      # just-a-parser).
      - name: Cache pack and toolchain
        id: pack-cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.local/state/pack
            /home/runner/.config/pack
            /home/runner/.local/bin/pack
          key: pack-${{ runner.os }}-${{ hashFiles('pack.toml') }}
          restore-keys: |
            pack-${{ runner.os }}-

      # `cache-hit` is true only on an EXACT key match, so it cannot
      # gate this step: a restore-keys fallback must skip the bootstrap
      # too. Test for the launcher the cache actually restores instead.
      - name: Install pack
        run: |
          if [ -x "$HOME/.local/bin/pack" ]; then
            echo "pack toolchain restored from cache; skipping bootstrap"
            exit 0
          fi
          git clone --depth=1 https://github.com/stefan-hoeck/idris2-pack
          cd idris2-pack
          for attempt in 1 2 3; do
            if make micropack SCHEME=chezscheme; then exit 0; fi
            echo "micropack attempt $attempt failed; third-party package"
            echo "hosts are fetched here, so retry before giving up"
            sleep 30
          done
          exit 1

      - name: Build Nova against the pinned nightly
        run: pack build nova.ipkg

  # Deliberately NOT gated on `pack`: the site is produced by the `nix`
  # job, and making its deploy hostage to micropack's third-party
  # resolution would re-import the flakiness the flake exists to avoid.
  deploy-pages:
    needs: [nix]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the docs site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

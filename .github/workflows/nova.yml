name: nova

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

jobs:

  specs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # fails on rule-shaped citations in src/idris that no spec defines
      # (typos / undocumented rules) and on duplicate rule names
      - name: Cross-check spec rules against sources
        run: python3 tools/render-specs.py --check

      - name: Render specs
        run: python3 tools/render-specs.py --out build/docs/specs.html

      - name: Upload rendered specs
        uses: actions/upload-artifact@v4
        with:
          name: rendered-specs
          path: build/docs/specs.html

      # the reference QUOTES src/nova and the goldens rather than
      # copying them: fails on a quotation that has drifted, a cited
      # file that is gone, or a rule name the specs no longer define.
      # Also run by ./test.sh (tests/nova/docs); repeated here because
      # this job needs no Idris build and so reports in seconds
      - name: Check language reference against the sources
        run: python3 tools/render-reference.py --check

      # fails on a chapter source listed in PARTS but missing, or
      # present in docs/reference but listed nowhere
      - name: Render language reference
        run: python3 tools/render-reference.py --out build/docs/reference.html

      - name: Upload rendered reference
        uses: actions/upload-artifact@v4
        with:
          name: rendered-reference
          path: build/docs/reference.html

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme libgmp-dev

      # pack is XDG-based: ~/.local/state/pack holds the toolchain it
      # resolves from pack.toml (the pinned idris2 commit, the package
      # collection, the custom dependencies), ~/.config/pack the global
      # config, ~/.local/bin/pack the launcher (already on the runner's
      # PATH). A hit skips the whole Idris2 bootstrap. Keyed on
      # pack.toml, so changing a pin misses — but restore-keys then
      # falls back to the most recent toolchain we built, and pack
      # fetches just the dependency whose pin moved. That fallback is
      # what keeps a one-line pin change off the cold path: micropack
      # resolves the WHOLE package collection, ~238 third-party repos,
      # and any one of them being unreachable fails the build (observed:
      # codeberg.org 504s taking down a run that only repinned
      # just-a-parser).
      - name: Cache pack and toolchain
        id: pack-cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.local/state/pack
            /home/runner/.config/pack
            /home/runner/.local/bin/pack
          key: pack-${{ runner.os }}-${{ hashFiles('pack.toml') }}
          restore-keys: |
            pack-${{ runner.os }}-

      # `cache-hit` is true only on an EXACT key match, so it cannot
      # gate this step: a restore-keys fallback must skip the bootstrap
      # too. Test for the launcher the cache actually restores instead.
      - name: Install pack
        run: |
          if [ -x "$HOME/.local/bin/pack" ]; then
            echo "pack toolchain restored from cache; skipping bootstrap"
            exit 0
          fi
          git clone --depth=1 https://github.com/stefan-hoeck/idris2-pack
          cd idris2-pack
          for attempt in 1 2 3; do
            if make micropack SCHEME=chezscheme; then exit 0; fi
            echo "micropack attempt $attempt failed; third-party package"
            echo "hosts are fetched here, so retry before giving up"
            sleep 30
          done
          exit 1

      - name: Build Nova
        run: pack build nova.ipkg

      - name: Run tests
        run: ./test.sh

      # src/nova is kept in CANONICAL DISTILL FORM
      # (docs/NovaPerfectSurface.txt): distilling the corpus must
      # reproduce it byte for byte
      - name: Check canonical distill form
        run: ./check-distill.sh

      - name: Build nova-docs
        run: pack build nova-docs.ipkg

      - name: Render Nova sources
        run: |
          mkdir -p build/docs/nova
          pack run nova-docs.ipkg build/docs/nova src/nova/*.nova
          cp tools/nova-docs.css build/docs/nova/

      - name: Upload rendered Nova sources
        uses: actions/upload-artifact@v4
        with:
          name: rendered-nova-docs
          path: build/docs/nova

  deploy-pages:
    needs: [specs, build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download rendered specs
        uses: actions/download-artifact@v4
        with:
          name: rendered-specs
          path: site

      - name: Download rendered reference
        uses: actions/download-artifact@v4
        with:
          name: rendered-reference
          path: site

      - name: Download rendered Nova sources
        uses: actions/download-artifact@v4
        with:
          name: rendered-nova-docs
          path: site/nova

      - name: Add landing page
        run: cp tools/pages-index.html site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
